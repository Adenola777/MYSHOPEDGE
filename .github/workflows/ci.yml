# Runs the checks a contributor runs locally, on every push and pull request.
#
# Each command below passed on 24 September 2026 in a clean environment with Python 3.11
# and Node 22. None of the tests needs a database, credentials or the network, so no
# secret is configured here and none should be.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt ruff pip-audit
      # Correctness lint, configured in ruff.toml at the repository root.
      - run: ruff check .
        working-directory: .
      # Known vulnerabilities in the service's dependencies.
      - run: pip-audit -r requirements.txt
      - run: python tests/test_auth_verification.py
      - run: python tests/test_contract_conformance.py
      - run: python tests/test_handlers_smoke.py
      - run: python tests/test_business_date.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # There is no lockfile, because .gitignore excludes web/package-lock.json.
      - run: npm install
      - run: npm run lint
      # Fails on a high or critical advisory. postcss is pinned in package.json overrides.
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans every commit for credentials. Pinned to the version that scanned this
      # repository clean on 24 September 2026, 168 commits.
      - run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar xzf gl.tgz gitleaks
          ./gitleaks git --redact -v .
