            '
          properties:
            count:
              type: integer
              minimum: 0
            amount:
              $ref: '#/components/schemas/Money'
        next_cursor:
          type:
          - string
          - 'null'
    ProductRow:
      type: object
      required:
      - product_id
      - title
      - units
      - gross_sales
      - net_proceeds
      properties:
        product_id:
          type: string
          format: uuid
        tiktok_product_id:
          type: string
        title:
          type:
          - string
          - 'null'
        units:
          type: integer
          minimum: 0
        gross_sales:
          $ref: '#/components/schemas/Money'
        net_proceeds:
          $ref: '#/components/schemas/Money'
        kept:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/Money'
        kept_reason:
          type:
          - string
          - 'null'
        returns_units:
          type: integer
          minimum: 0
        cost_known:
          type: boolean
    ProductDetail:
      type: object
      required:
      - product
      - period
      - per_unit
      - sections
      properties:
        product:
          $ref: '#/components/schemas/ProductRow'
        period:
          $ref: '#/components/schemas/Period'
        per_unit:
          type: object
          description: The one-unit breakdown. The same lines as the calculator, divided by units.
          required:
          - units
          - sections
          properties:
            units:
              type: integer
              minimum: 1
            sections:
              type: array
              items:
                $ref: '#/components/schemas/CalculatorSection'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/CalculatorSection'
        stock:
          $ref: '#/components/schemas/StockPosition'
        returns:
          $ref: '#/components/schemas/ReturnMetrics'
        skus:
          type: array
          items:
            type: object
            properties:
              sku_id:
                type: string
                format: uuid
              tiktok_sku_id:
                type: string
              seller_sku:
                type:
                - string
                - 'null'
                description: 'Often empty. TikTok permits a blank seller SKU, so nothing may key on it.

                  '
              variant_label:
                type:
                - string
                - 'null'
              cost:
                type:
                - object
                - 'null'
                allOf:
                - $ref: '#/components/schemas/Money'
    Insight:
      type: object
      required:
      - rule_key
      - severity
      - headline
      - evidence
      properties:
        rule_key:
          type: string
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
        headline:
          type: string
        detail:
          type:
          - string
          - 'null'
        evidence:
          type: object
          description: 'The figures the insight was computed from, so the seller can check it. An

            insight without evidence is not shown.

            '
          properties:
            period:
              $ref: '#/components/schemas/Period'
            values:
              type: array
              items:
                type: object
                required:
                - label
                properties:
                  label:
                    type: string
                  amount:
                    type:
                    - object
                    - 'null'
                    allOf:
                    - $ref: '#/components/schemas/Money'
                  number:
                    type:
                    - number
                    - 'null'
            entity_type:
              type:
              - string
              - 'null'
            entity_id:
              type:
              - string
              - 'null'
              format: uuid
    Trends:
      type: object
      required:
      - measure
      - basis
      - points
      properties:
        measure:
          type: string
        basis:
          $ref: '#/components/schemas/Basis'
        points:
          type: array
          maxItems: 12
          items:
            type: object
            required:
            - month
            - value
            - complete
            properties:
              month:
                type: string
                pattern: ^\d{4}-(0[1-9]|1[0-2])$
              value:
                $ref: '#/components/schemas/Money'
              complete:
                type: boolean
                description: 'False for a month still settling, or one before the shop connected. A bar

                  drawn from a partial month must be marked, not shown as a fall in trade.

                  '
    LedgerEntry:
      type: object
      required:
      - id
      - entry_type
      - amount
      - occurred_at
      - basis_day
      - source
      properties:
        id:
          type: string
          format: uuid
        entry_type:
          type: string
          enum:
          - sale
          - platform_deduction
          - refund
          - payout
          - return_cost
          - write_off
          - adjustment
        category:
          $ref: '#/components/schemas/LedgerCategory'
        tiktok_fee_type:
          type:
          - string
          - 'null'
        amount:
          $ref: '#/components/schemas/Money'
        occurred_at:
          type: string
          format: date-time
        basis_day:
          type: string
          format: date
          description: Local date
          Europe/London.: null
        basis_month:
          type: string
          format: date
        source:
          type: string
          enum:
          - tiktok
          - seller
          - system
        source_ref:
          type:
          - string
          - 'null'
        attribution:
          type: string
          enum:
          - direct
          - allocated
          - none
        order_id:
          type:
          - string
          - 'null'
          format: uuid
        tiktok_order_id:
          type:
          - string
          - 'null'
        sku_id:
          type:
          - string
          - 'null'
          format: uuid
        tiktok_invoice_number:
          type:
          - string
          - 'null'
        reverses_entry_id:
          type:
          - string
          - 'null'
          format: uuid
        reason:
          type:
          - string
          - 'null'
    StockPosition:
      type: object
      required:
      - sku_id
      - on_shelf
      - state
      - as_of
      properties:
        sku_id:
          type: string
          format: uuid
        tiktok_sku_id:
          type: string
        seller_sku:
          type:
          - string
          - 'null'
        product_title:
          type:
          - string
          - 'null'
        tiktok_stock:
          type: integer
        adjusted_delta:
          type: integer
        on_shelf:
          type: integer
          description: TikTok stock plus the seller's adjustment. Computed in the database.
        sold_not_posted:
          type: integer
          minimum: 0
        coming_back:
          type: integer
          minimum: 0
        written_off:
          type: integer
          minimum: 0
        state:
          type: string
          enum:
          - healthy
          - low
          - out
          - coming_back
        days_left:
          type:
          - number
          - 'null'
          description: Null when there is no recent sales rate to divide by.
        as_of:
          type: string
          format: date-time
    StockMovement:
      type: object
      required:
      - id
      - movement_type
      - quantity
      - occurred_at
      properties:
        id:
          type: string
          format: uuid
        movement_type:
          type: string
          enum:
          - sale_reserved
          - posted
          - cancelled
          - return_resellable
          - write_off
          - manual_adjustment
          - adjustment_absorbed
        quantity:
          type: integer
        occurred_at:
          type: string
          format: date-time
        order_id:
          type:
          - string
          - 'null'
          format: uuid
        return_id:
          type:
          - string
          - 'null'
          format: uuid
        reason:
          type:
          - string
          - 'null'
        created_by:
          type:
          - string
          - 'null'
          format: uuid
    ReturnSummary:
      type: object
      required:
      - id
      - tiktok_return_id
      - tiktok_order_id
      - kind
      - status
      properties:
        id:
          type: string
          format: uuid
        tiktok_return_id:
          type: string
        tiktok_order_id:
          type: string
        tiktok_credit_note_number:
          type:
          - string
          - 'null'
        kind:
          type: string
          enum:
          - cancellation
          - refund_only
          - return_refund
        status:
          type: string
        reason_code:
          type:
          - string
          - 'null'
          description: 'TikTok''s own value, which arrives as localised free text rather than a code.
            Kept

            verbatim and mapped for display, never shown raw.

            '
        refund:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/Money'
        requested_at:
          type:
          - string
          - 'null'
          format: date-time
        refund_completed_at:
          type:
          - string
          - 'null'
          format: date-time
        items_awaiting_check:
          type: integer
          minimum: 0
        return_cost:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/Money'
    ReturnItem:
      type: object
      required:
      - id
      - return_id
      - quantity
      - seller_check_status
      properties:
        id:
          type: string
          format: uuid
        return_id:
          type: string
          format: uuid
        sku_id:
          type:
          - string
          - 'null'
          format: uuid
        quantity:
          type: integer
          minimum: 1
        seller_check_status:
          type: string
          enum:
          - pending
          - resellable
          - unsellable
          - not_applicable
        checked_at:
          type:
          - string
          - 'null'
          format: date-time
        return_postage:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/Money'
    ReturnMetrics:
      type: object
      required:
      - period
      - return_rate
      - returns_units
      - total_return_cost
      properties:
        period:
          $ref: '#/components/schemas/Period'
        return_rate:
          type: number
          minimum: 0
          maximum: 1
          description: Returned units divided by units sold in the same period.
        returns_units:
          type: integer
          minimum: 0
        total_return_cost:
          $ref: '#/components/schemas/Money'
        write_off_total:
          $ref: '#/components/schemas/Money'
        most_returned:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: string
                format: uuid
              title:
                type:
                - string
                - 'null'
              units:
                type: integer
                minimum: 0
              cost:
                $ref: '#/components/schemas/Money'
    CostUpload:
      type: object
      required:
      - id
      - filename
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        status:
          type: string
          enum:
          - uploaded
          - mapped
          - confirmed
          - applied
          - failed
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type:
          - string
          - 'null'
          format: date-time
        detected_columns:
          type: array
          items:
            type: string
        suggested_mapping:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/ColumnMapping'
          description: A proposal from the headers. Never applied without confirmation.
        column_mapping:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/ColumnMapping'
        rows_total:
          type:
          - integer
          - 'null'
        rows_matched:
          type:
          - integer
          - 'null'
        rows_unmatched:
          type:
          - integer
          - 'null'
        rows_duplicate:
          type:
          - integer
          - 'null'
        error:
          type:
          - string
          - 'null'
    ColumnMapping:
      type: object
      required:
      - match_on
      - cost_column
      properties:
        match_on:
          type: string
          enum:
          - seller_sku
          - tiktok_sku_id
          description: 'Which column identifies the SKU. No default. TikTok permits an empty

            `seller_sku`, and the sandbox shop returned one, so a file keyed on seller SKU

            will not match those products. The seller chooses while looking at their file.

            '
        key_column:
          type: string
        cost_column:
          type: string
        packing_column:
          type:
          - string
          - 'null'
        postage_column:
          type:
          - string
          - 'null'
        currency:
          type: string
          default: GBP
    ProductCost:
      type: object
      required:
      - sku_id
      - cost
      - source
      - effective_from
      properties:
        sku_id:
          type: string
          format: uuid
        cost:
          $ref: '#/components/schemas/Money'
        packing:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/Money'
        postage:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/Money'
        source:
          type: string
          enum:
          - upload
          - manual
        effective_from:
          type: string
          format: date
        supersedes:
          type:
          - string
          - 'null'
          format: uuid
          description: The cost this replaced. Costs are never overwritten in place.
    CostCoverage:
      type: object
      required:
      - period
      - coverage
      - units_with_cost
      - units_total
      properties:
        period:
          $ref: '#/components/schemas/Period'
        coverage:
          type: number
          minimum: 0
          maximum: 1
        units_with_cost:
          type: integer
          minimum: 0
        units_total:
          type: integer
          minimum: 0
        skus_missing_cost:
          type: integer
          minimum: 0
        top_missing:
          type: array
          description: The products whose missing cost is suppressing the most figures.
          items:
            type: object
            properties:
              sku_id:
                type: string
                format: uuid
              product_title:
                type:
                - string
                - 'null'
              units:
                type: integer
                minimum: 0
              gross_sales:
                $ref: '#/components/schemas/Money'
    Discrepancy:
      type: object
      required:
      - id
      - kind
      - entity_type
      - status
      - opened_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - product_code
          - order_reference
          - transaction_reference
          - amount
          - return_unmatched
          - duplicate
        entity_type:
          type: string
        entity_id:
          type:
          - string
          - 'null'
          format: uuid
        field:
          type:
          - string
          - 'null'
        tiktok_value:
          type:
          - string
          - 'null'
        seller_value:
          type:
          - string
          - 'null'
        applied_value:
          type:
          - string
          - 'null'
          description: 'What MyShopEdge used. TikTok takes precedence while a discrepancy is open, so

            this normally equals `tiktok_value`.

            '
        status:
          type: string
          enum:
          - open
          - resolved
        resolution:
          type:
          - string
          - 'null'
          enum:
          - accepted_tiktok
          - corrected_seller
          - explained
          - null
        note:
          type:
          - string
          - 'null'
        effect:
          type:
          - object
          - 'null'
          description: What the discrepancy changes if resolved the other way.
        opened_at:
          type: string
          format: date-time
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
    OtherChannelSales:
      type: object
      required:
      - month
      - channel
      - gross
      - entered_at
      properties:
        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        channel:
          type: string
        gross:
          $ref: '#/components/schemas/Money'
        entered_at:
          type: string
          format: date-time
    ShopExportJob:
      allOf:
      - $ref: '#/components/schemas/ExportJob'
      - type: object
        required:
        - kind
        - format
        - basis
        - period_start
        - period_end
        properties:
          kind:
            type: string
            enum:
            - month_summary
            - ledger
            - transactions
          format:
            type: string
            enum:
            - xlsx
            - csv
          basis:
            $ref: '#/components/schemas/Basis'
          period_start:
            type: string
            format: date
          period_end:
            type: string
            format: date
          row_count:
            type:
            - integer
            - 'null'
    VatMonitor:
      type: object
      required:
      - as_of
      - rolling_twelve_month_turnover
      - threshold
      - above_threshold
      - includes_other_channels
      properties:
        as_of:
          type: string
          format: date-time
        rolling_twelve_month_turnover:
          $ref: '#/components/schemas/Money'
        threshold:
          $ref: '#/components/schemas/Money'
        headroom:
          $ref: '#/components/schemas/Money'
        above_threshold:
          type: boolean
        includes_other_channels:
          type: boolean
          description: 'False when the seller has entered no other-channel figures. The turnover is then

            TikTok only and understates the threshold test, which must be said on screen.

            '
        months:
          type: array
          maxItems: 12
          items:
            type: object
            properties:
              month:
                type: string
                pattern: ^\d{4}-(0[1-9]|1[0-2])$
              tiktok_gross:
                $ref: '#/components/schemas/Money'
              other_channels_gross:
                $ref: '#/components/schemas/Money'
        rule_key:
          type: string
        reviewed_at:
          type:
          - string
          - 'null'
          format: date
    SetAside:
      type: object
      required:
      - as_of
      - amount
      - confidence
      properties:
        as_of:
          type: string
          format: date-time
        amount:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Null when the figure cannot be produced honestly.
        unavailable_reason:
          type:
          - string
          - 'null'
          enum:
          - incomplete_costs
          - no_tax_profile
          - insufficient_history
          - null
        confidence:
          $ref: '#/components/schemas/Confidence'
        period:
          $ref: '#/components/schemas/Period'
        basis_of_estimate:
          type: array
          description: The figures and rules behind the estimate, so it can be checked.
          items:
            type: object
            properties:
              label:
                type: string
              amount:
                type:
                - object
                - 'null'
                allOf:
                - $ref: '#/components/schemas/Money'
              rule_key:
                type:
                - string
                - 'null'
